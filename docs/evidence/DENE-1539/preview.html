<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DENE-1539 连通表单预览</title>
<style>
body{margin:0;font:14px/1.5 -apple-system,"PingFang SC",sans-serif;color:#18181b;background:#fafafa}
main{max-width:640px;margin:0 auto;padding:16px}
h2{font-size:15px;margin:20px 0 8px;color:#52525b}
.card{background:#fff;border:1px solid #e4e4e7;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.l{font-size:13px;font-weight:500}
input[type=text]{width:100%;box-sizing:border-box;border:1px solid #e4e4e7;border-radius:6px;padding:6px 10px;font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips label{border:1px solid #e4e4e7;border-radius:6px;padding:6px 10px;display:flex;gap:8px;align-items:center}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px}.cap{font-size:12px;color:#71717a;margin:0}
button{border:0;border-radius:6px;padding:6px 12px;background:#18181b;color:#fff;font:inherit;white-space:nowrap}
.tag{font-size:12px;color:#71717a;margin:16px 0 4px}
</style>
<main>
<div class="tag" id="tag"></div>
<div class="card">
 <div><div class="l">对方工作区地址</div><input type="text" value="wd-game-shengchan"></div>
 <div><div class="l" id="pl"></div><div class="chips" style="margin-top:6px"><label><input type="checkbox" checked>Multica 魔改</label><label><input type="checkbox">ai100</label><label><input type="checkbox">Online Tarot</label></div></div>
 <div class="foot"><p class="cap">勾了项目也不会带出私有任务和私有项目。</p><button>发起连通</button></div>
</div>
<h2>连进来的</h2>
<div class="card"><p class="cap" id="ie"></p></div>
</main>
<script>
const after=location.hash==="#after";
document.getElementById("tag").textContent=after?"改后":"改前";
document.getElementById("pl").textContent=after?"把本工作区的哪些项目给对方看":"连通哪些项目";
document.getElementById("ie").textContent=after?"还没有工作区发来连通。想看对方的项目，要请对方在 TA 的工作区发起。":"还没有工作区发来连通。";
</script></html>
