<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DENE-1671 连通托管界面</title>
<style>
  :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; color: #18181b; background: #fafafa; }
  body { margin: 0; padding: 24px 16px 48px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  h2 { font-size: 14px; margin: 32px 0 12px; color: #52525b; font-weight: 500; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  figure { margin: 0; width: 195px; }
  figure.mid { width: 320px; }
  figure.wide { width: min(640px, 100%); }
  img { display: block; width: 100%; border: 1px solid #e4e4e7; border-radius: 12px; background: #fff; }
  figcaption { font-size: 12px; color: #71717a; margin-top: 6px; }
  @media (max-width: 480px) {
    figure { width: calc(50% - 8px); }
    figure.mid, figure.wide { width: 100%; }
  }
</style>
</head>
<body>
<h1>连通托管：设置开关、自动化代办记录、连通视图</h1>
<h2>手机 375px</h2>
<div class="row">
  <figure><img src="settings-375.jpg" alt=""><figcaption>设置 · 连通工作区</figcaption></figure>
  <figure><img src="autopilot-375.jpg" alt=""><figcaption>自动化详情 · 经连通的代办</figcaption></figure>
  <figure><img src="linked-375.jpg" alt=""><figcaption>连通视图 · 已开托管</figcaption></figure>
</div>
<h2>768px</h2>
<div class="row">
  <figure class="mid"><img src="settings-768.jpg" alt=""><figcaption>设置</figcaption></figure>
  <figure class="mid"><img src="autopilot-768.jpg" alt=""><figcaption>自动化详情</figcaption></figure>
  <figure class="mid"><img src="linked-768.jpg" alt=""><figcaption>连通视图</figcaption></figure>
</div>
<h2>1280px</h2>
<div class="row">
  <figure class="wide"><img src="settings-1280.jpg" alt=""><figcaption>源方所有者可开关；连进来的那条写明原因</figcaption></figure>
  <figure class="wide"><img src="settings-on-1280.jpg" alt=""><figcaption>打开后</figcaption></figure>
  <figure class="wide"><img src="autopilot-1280.jpg" alt=""><figcaption>自动化详情</figcaption></figure>
  <figure class="wide"><img src="linked-1280.jpg" alt=""><figcaption>连通视图</figcaption></figure>
</div>
</body>
</html>
