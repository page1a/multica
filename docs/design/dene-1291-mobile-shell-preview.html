<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Multica mobile shell preview</title>
<style>
:root{font:14px system-ui,sans-serif;color:#16171b;background:#f8f8f9;--safe:env(safe-area-inset-bottom);--touch:44px}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#f8f8f9}.shell{min-height:100dvh;padding:16px 16px calc(80px + var(--safe));max-width:960px;margin:auto}.bar{height:44px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ddd}.button{min-width:var(--touch);min-height:var(--touch);border:1px solid #d8d8dc;border-radius:10px;background:#fff;padding:0 14px}.card{margin-top:16px;border:1px solid #dedee3;border-radius:14px;background:#fff;padding:16px}.sheet,.dialog{margin-top:16px;border:1px solid #d8d8dc;background:#fff;box-shadow:0 12px 30px #0002;padding:16px}.sheet{border-radius:16px 16px 0 0;max-height:calc(100dvh - var(--safe));overflow:auto}.dialog{border-radius:14px;max-height:calc(100dvh - 32px - var(--safe));overflow:auto}.toast{position:fixed;left:8px;right:8px;bottom:max(8px,var(--safe));margin:auto;max-width:448px;border-radius:10px;background:#202124;color:#fff;padding:12px 14px}.fab{position:fixed;right:12px;bottom:calc(52px + var(--safe));width:48px;height:48px;border-radius:50%;border:0;background:#fff;box-shadow:0 8px 24px #0002;font-size:20px}@media(min-width:768px){.shell{padding-bottom:24px}.fab{bottom:16px}.toast{bottom:16px}}
</style>
<main class="shell"><header class="bar"><strong>Multica</strong><button class="button">菜单</button></header><section class="card"><h1>移动共性预览</h1><p>375px 下按钮保留 44px 触控区，内容和反馈避开底部安全区。</p><button class="button">打开弹层</button></section><section class="sheet"><strong>Sheet</strong><p>长列表可滚动，底部留出安全区，返回手势可关闭。</p><button class="button">完成</button></section><section class="dialog"><strong>Dialog</strong><p>弹窗高度受视口和安全区限制，窄屏不会把操作按钮推出屏幕。</p></section></main><button class="fab" aria-label="打开聊天">◌</button><div class="toast">已保存 · toast 不遮挡底部手势区</div>
