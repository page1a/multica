name: Mobile Verify

# Manual-only: mobile is not a CI gate on this fork. Nothing about
# apps/mobile blocks a PR or a push to kun — run this workflow by hand
# from the Actions tab (or `gh workflow run mobile-verify.yml`) when a
# mobile change is actually ready to be checked, typically before a
# mobile release.
#
# Mobile's vitest suite is intentionally narrow (Node env, pure-function
# tests under apps/mobile/lib/*.test.ts — see apps/mobile/vitest.config.ts).
# RN component-level rendering is not exercised here.
#
# The UI radius-token check below is repo-wide, not mobile-specific; the
# main ci.yml workflow runs it too, so it stays covered on every PR.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Type check, lint, and test
        run: pnpm exec turbo typecheck lint test --filter=@multica/mobile
